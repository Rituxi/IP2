name: Update Device Models

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild even if the upstream CSV version is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rituxip-device-models

jobs:
  update:
    if: vars.MOBILEMODELS_PRODUCTION_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ip-api-service-cf
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run sync:device-models -- --publish ${{ inputs.rebuild && '--rebuild' || '' }}
        env:
          MOBILEMODELS_PRODUCTION_ENABLED: ${{ vars.MOBILEMODELS_PRODUCTION_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
